* {

body {

}

.screen {

}

.card {

h1 {

h2 {

}

p {

}

button {

    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;

button:hover {
    transform: scale(1.04);
    background: #641e31;
}

.choice {
    display: block;
    width: 90%;

.correct {

.wrong {

.objects span {

    opacity: 0.65;
    animation: float 4s ease-in-out infinite;
}

.objects span:nth-child(1) {
    left: 7%;
    top: 12%;
}

.objects span:nth-child(2) {
    right: 8%;
    top: 18%;
}

.objects span:nth-child(3) {
    left: 12%;

.objects span:nth-child(4) {
    right: 12%;

.objects span:nth-child(5) {
    left: 45%;
    top: 7%;

.objects span:nth-child(6) {
    right: 38%;

}

.objects span:nth-child(7) {
    left: 28%;
    top: 40%;
}

.objects span:nth-child(8) {
    right: 25%;
    top: 55%;
}

@keyframes float {
    0%, 100% {
        transform: translateY(0) rotate(0deg);
    }

    50% {
        transform: translateY(-13px) rotate(6deg);
    }
}
